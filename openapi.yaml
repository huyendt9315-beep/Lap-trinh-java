openapi: 3.0.3
info:
  title: FreshVend API
  version: 1.0.0
  description: Hợp đồng FreshVend. Quyền gọi theo từng operation được ghi trong description và x-roles. OAuth thuộc dịch
    vụ xác thực ngoài /api/v1.
servers:
- url: /api/v1
paths:
  /me:
    get:
      summary: Tài khoản hiện tại
      operationId: fv1
      description: 'Quyền: ADMIN/OPERATOR/MAINTENANCE'
      security:
      - staffOAuth: []
      parameters: []
      responses:
        '200':
          description: Tài khoản hiện tại
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  login:
                    type: string
                  role:
                    type: string
                  active:
                    type: boolean
                required:
                - id
                - login
                - role
                - active
              example:
                id: 2
                login: nv01
                role: OPERATOR
                active: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      x-roles:
      - ADMIN
      - OPERATOR
      - MAINTENANCE
  /users:
    get:
      summary: Danh sách nhân viên
      operationId: fv2
      description: 'Quyền: ADMIN'
      security:
      - staffOAuth: []
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Danh sách nhân viên
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    login:
                      type: string
                    role:
                      type: string
                    active:
                      type: boolean
                  required:
                  - id
                  - login
                  - role
                  - active
              example:
              - id: 2
                login: nv01
                role: OPERATOR
                active: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      x-roles:
      - ADMIN
    post:
      summary: Tạo nhân viên
      operationId: fv3
      description: 'Quyền: ADMIN'
      security:
      - staffOAuth: []
      parameters: []
      responses:
        '201':
          description: Tạo nhân viên
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  login:
                    type: string
                  role:
                    type: string
                  active:
                    type: boolean
                required:
                - id
                - login
                - role
                - active
              example:
                id: 2
                login: nv01
                role: OPERATOR
                active: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
                role:
                  type: string
              required:
              - login
              - password
              - role
            example:
              login: nv01
              password: example-password
              role: OPERATOR
      x-roles:
      - ADMIN
  /users/{userId}:
    patch:
      summary: Đổi vai trò hoặc khóa tài khoản
      operationId: fv4
      description: 'Quyền: ADMIN'
      security:
      - staffOAuth: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Đổi vai trò hoặc khóa tài khoản
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  login:
                    type: string
                  role:
                    type: string
                  active:
                    type: boolean
                required:
                - id
                - login
                - role
                - active
              example:
                id: 2
                login: nv01
                role: OPERATOR
                active: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                active:
                  type: boolean
              required:
              - role
              - active
            example:
              role: OPERATOR
              active: true
      x-roles:
      - ADMIN
  /machines:
    get:
      summary: Giám sát đội máy
      operationId: fv5
      description: 'Quyền: ADMIN/OPERATOR/MAINTENANCE'
      security:
      - staffOAuth: []
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Giám sát đội máy
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    code:
                      type: string
                    location:
                      type: string
                    status:
                      type: string
                    lastSeenAt:
                      type: string
                      format: date-time
                      nullable: true
                  required:
                  - id
                  - code
                  - location
                  - status
                  - lastSeenAt
              example:
              - id: 1
                code: FV01
                location: UTH
                status: ONLINE
                lastSeenAt: '2026-11-07T10:00:00Z'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      x-roles:
      - ADMIN
      - OPERATOR
      - MAINTENANCE
  /machines/{machineId}/cold-chain:
    put:
      summary: Cấu hình cảnh báo
      operationId: fv6
      description: 'Quyền: ADMIN'
      security:
      - staffOAuth: []
      parameters:
      - name: machineId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Cấu hình cảnh báo
          content:
            application/json:
              schema:
                type: object
                properties:
                  minC:
                    type: number
                  maxC:
                    type: number
                  degradedMessage:
                    type: string
                required:
                - minC
                - maxC
                - degradedMessage
              example:
                minC: 2
                maxC: 8
                degradedMessage: Máy tạm dừng bán
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minC:
                  type: number
                maxC:
                  type: number
                degradedMessage:
                  type: string
              required:
              - minC
              - maxC
              - degradedMessage
            example:
              minC: 2
              maxC: 8
              degradedMessage: Máy tạm dừng bán
      x-roles:
      - ADMIN
  /products:
    get:
      summary: Danh mục sản phẩm
      operationId: fv7
      description: 'Quyền: ADMIN/OPERATOR'
      security:
      - staffOAuth: []
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Danh mục sản phẩm
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    sku:
                      type: string
                    name:
                      type: string
                    imageUrl:
                      type: string
                    priceVnd:
                      type: integer
                      format: int64
                    active:
                      type: boolean
                  required:
                  - id
                  - sku
                  - name
                  - imageUrl
                  - priceVnd
                  - active
              example:
              - id: 9
                sku: BOWL01
                name: Trái cây hỗn hợp
                imageUrl: https://example.org/bowl.jpg
                priceVnd: 30000
                active: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      x-roles:
      - ADMIN
      - OPERATOR
    post:
      summary: Thêm sản phẩm
      operationId: fv8
      description: 'Quyền: ADMIN'
      security:
      - staffOAuth: []
      parameters: []
      responses:
        '201':
          description: Thêm sản phẩm
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  sku:
                    type: string
                  name:
                    type: string
                  imageUrl:
                    type: string
                  priceVnd:
                    type: integer
                    format: int64
                  active:
                    type: boolean
                required:
                - id
                - sku
                - name
                - imageUrl
                - priceVnd
                - active
              example:
                id: 9
                sku: BOWL01
                name: Trái cây hỗn hợp
                imageUrl: https://example.org/bowl.jpg
                priceVnd: 30000
                active: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                name:
                  type: string
                imageUrl:
                  type: string
                priceVnd:
                  type: integer
                  format: int64
              required:
              - sku
              - name
              - imageUrl
              - priceVnd
            example:
              sku: BOWL01
              name: Trái cây hỗn hợp
              imageUrl: https://example.org/bowl.jpg
              priceVnd: 30000
      x-roles:
      - ADMIN
  /products/{productId}/price:
    patch:
      summary: Điều chỉnh giá
      operationId: fv9
      description: 'Quyền: ADMIN/OPERATOR'
      security:
      - staffOAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Điều chỉnh giá
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  sku:
                    type: string
                  name:
                    type: string
                  imageUrl:
                    type: string
                  priceVnd:
                    type: integer
                    format: int64
                  active:
                    type: boolean
                required:
                - id
                - sku
                - name
