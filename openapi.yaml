  /machines/{machineId}/slots:
    get:
      summary: Xem tồn từng ngăn
      operationId: fv10
      description: 'Quyền: ADMIN/OPERATOR/MAINTENANCE'
      security:
      - staffOAuth: []
      parameters:
      - name: machineId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Xem tồn từng ngăn
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    machineId:
                      type: integer
                      format: int64
                    slotNo:
                      type: integer
                      format: int32
                    productId:
                      type: integer
                      format: int64
                    capacity:
                      type: integer
                      format: int32
                    lowThreshold:
                      type: integer
                      format: int32
                    availableQty:
                      type: integer
                      format: int32
                  required:
                  - id
                  - machineId
                  - slotNo
                  - productId
                  - capacity
                  - lowThreshold
                  - availableQty
              example:
              - id: 4
                machineId: 1
                slotNo: 2
                productId: 9
                capacity: 12
                lowThreshold: 2
                availableQty: 6
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      x-roles:
      - ADMIN
      - OPERATOR
      - MAINTENANCE
  /slots/{slotId}/assignment:
    put:
      summary: Gán sản phẩm vào ngăn
      operationId: fv11
      description: 'Quyền: ADMIN/OPERATOR'
      security:
      - staffOAuth: []
      parameters:
      - name: slotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Gán sản phẩm vào ngăn
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  machineId:
                    type: integer
                    format: int64
                  slotNo:
                    type: integer
                    format: int32
                  productId:
                    type: integer
                    format: int64
                  capacity:
                    type: integer
                    format: int32
                  lowThreshold:
                    type: integer
                    format: int32
                  availableQty:
                    type: integer
                    format: int32
                required:
                - id
                - machineId
                - slotNo
                - productId
                - capacity
                - lowThreshold
                - availableQty
              example:
                id: 4
                machineId: 1
                slotNo: 2
                productId: 9
                capacity: 12
                lowThreshold: 2
                availableQty: 0
        '400':
          $ref: '#/components/responses/E400'
        '401':
