        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                  format: int64
                lowThreshold:
                  type: integer
                  format: int32
              required:
              - productId
              - lowThreshold
            example:
              productId: 9
              lowThreshold: 2
      x-roles:
      - ADMIN
      - OPERATOR
  /slots/{slotId}/lots:
    post:
      summary: Nhập hàng và ghi người nhập
      operationId: fv12
      description: 'Quyền: ADMIN/OPERATOR'
      security:
      - staffOAuth: []
      parameters:
      - name: slotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Nhập hàng và ghi người nhập
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  slotId:
                    type: integer
                    format: int64
                  productId:
                    type: integer
                    format: int64
                  operatorId:
                    type: integer
                    format: int64
                  qtyIn:
                    type: integer
                    format: int32
                  qtyOnHand:
                    type: integer
                    format: int32
                  receivedAt:
                    type: string
                    format: date-time
                  expiresAt:
                    type: string
                    format: date-time
                required:
                - id
                - slotId
                - productId
                - operatorId
                - qtyIn
                - qtyOnHand
                - receivedAt
                - expiresAt
              example:
                id: 8
                slotId: 4
                productId: 9
                operatorId: 2
                qtyIn: 6
                qtyOnHand: 6
                receivedAt: '2026-11-07T10:00:00Z'
                expiresAt: '2026-11-09T10:00:00Z'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                  format: int64
                qtyIn:
                  type: integer
                  format: int32
                expiresAt:
                  type: string
                  format: date-time
              required:
              - productId
              - qtyIn
              - expiresAt
            example:
              productId: 9
              qtyIn: 6
              expiresAt: '2026-11-09T10:00:00Z'
      x-roles:
      - ADMIN
      - OPERATOR
    get:
      summary: Xem lịch sử nhập
      operationId: fv13
      description: 'Quyền: ADMIN/OPERATOR'
      security:
      - staffOAuth: []
      parameters:
      - name: slotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Xem lịch sử nhập
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    slotId:
                      type: integer
                      format: int64
                    productId:
                      type: integer
                      format: int64
                    operatorId:
                      type: integer
                      format: int64
                    qtyIn:
                      type: integer
                      format: int32
                    qtyOnHand:
                      type: integer
                      format: int32
                    receivedAt:
                      type: string
                      format: date-time
                    expiresAt:
                      type: string
                      format: date-time
                  required:
                  - id
                  - slotId
                  - productId
                  - operatorId
                  - qtyIn
                  - qtyOnHand
                  - receivedAt
                  - expiresAt
              example:
              - id: 8
                slotId: 4
                productId: 9
                operatorId: 2
                qtyIn: 6
                qtyOnHand: 6
                receivedAt: '2026-11-07T10:00:00Z'
                expiresAt: '2026-11-09T10:00:00Z'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '503':
          $ref: '#/components/responses/E503'
      x-roles:
      - ADMIN
      - OPERATOR
  /lots/{lotId}/removals:
    post:
      summary: Xác nhận lấy hàng hết hạn
      operationId: fv14
      description: 'Quyền: ADMIN/OPERATOR'
      security:
      - staffOAuth: []
      parameters:
      - name: lotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Xác nhận lấy hàng hết hạn
          content:
            application/json:
              schema:
                type: object
                properties:
                  lotId:
                    type: integer
                    format: int64
                  qtyOnHand:
                    type: integer
