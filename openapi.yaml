components:
  securitySchemes:
    staffOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes: {}
      description: 'Authorization Code với PKCE S256. API nhận access token JWT qua Authorization: Bearer.'
    gatewaySignature:
      type: apiKey
      in: header
      name: X-Signature
    machineOAuth:
      type: oauth2
      description: Token hệ thống dùng JWT, ràng buộc machineId và audience tương ứng KIOSK hoặc DEVICE. Thông tin client
        lưu ở dịch vụ tin cậy.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes: {}
  responses:
    E400:
      description: Dữ liệu sai
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              traceId:
                type: string
            required:
            - code
            - message
            - traceId
          example:
            code: REQUEST_ERROR
            message: Dữ liệu sai
            traceId: req-01
    E401:
      description: Thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              traceId:
                type: string
            required:
            - code
            - message
            - traceId
          example:
            code: REQUEST_ERROR
            message: Thông tin xác thực không hợp lệ
            traceId: req-01
    E403:
      description: Thiếu quyền
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              traceId:
                type: string
            required:
            - code
            - message
            - traceId
          example:
            code: REQUEST_ERROR
            message: Thiếu quyền
            traceId: req-01
    E404:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              traceId:
                type: string
            required:
            - code
            - message
            - traceId
          example:
            code: REQUEST_ERROR
            message: Không tìm thấy
            traceId: req-01
    E409:
      description: Xung đột trạng thái
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              traceId:
                type: string
            required:
            - code
            - message
            - traceId
          example:
            code: REQUEST_ERROR
            message: Xung đột trạng thái
            traceId: req-01
    E503:
      description: Dịch vụ tạm gián đoạn
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
